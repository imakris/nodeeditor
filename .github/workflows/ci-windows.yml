name: CI Windows

on:
  push:
    branches: [main, master]
    tags:
      - "*"
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows / Qt ${{ matrix.qt_version }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_version: "6.5.3"
          - qt_version: "6.7.1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}

      - name: Setup VS tools
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DOCS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --progress
